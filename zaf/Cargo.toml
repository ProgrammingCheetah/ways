[package]
name = "zaf"
version = "0.5.5"
edition = "2024"
description = "The verb set of the AI framework: one project-blind binary over a board, a VCS, a forge, a design source, runners and a gate."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "zaf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29.0"
derive_more = { version = "2.1", features = ["display", "from", "as_ref"] }
globset = "0.4.21"
humantime = "2.3.0"
libc = "0.2.191"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
rmcp = { version = "3.11.0", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
sha2 = "0.10"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time"] }
toml = "1.1"
tui-term = "0.3.4"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt-multi-thread", "time"] }

# zaf's own manifest: the ways repo runs the framework on itself.
# Nothing secret here; machine-private overrides go in .zaf/local.toml (git-ignored).

[project]
name = "ways"

[requires]
jj = "*"
gh = "*"

# Tasks live on the "Zaf Feature Release" Project (owner: the repo's), each one's state in its
# `zaf state` field, which zaf creates on its first write.
[board]
kind = "github-projects"
repo = "ProgrammingCheetah/ways"
project = 2

[vcs]
kind = "jj"

[forge]
kind = "github"
repo = "ProgrammingCheetah/ways"

# The design pages are in docs/, listed in docs/index.md. A page's id is its file name up to the
# first dash, so docs/zaf-actions.md is page `zaf`. `zaf ask` checks the keeper's quotes against
# them; with no source it rejects every citation, so the keeper could only say `not settled`.
# Tickets name docs by path, not id, so `brief` carries no page and the keeper serves them on request.
[design]
kind = "repo-dir"
path = "docs"

[workspaces]
path = ".zaf/workspaces"

[branches]
integration = "feature/{version}"
task = "feature/{version}-{epic}-{task}"

[gate]
full = "cd zaf && cargo fmt --check && cargo build && cargo clippy --all-targets -- -D warnings && cargo test"
light = "cd zaf && cargo fmt --check && cargo test"
tests = "cd zaf && cargo test {name}"

# The repo has no style page yet; the README is the stand-in until one exists.
[style]
path = "README.md"

# The pack the profiles carry: this repo's own teams plugin. `zaf profile init` adds this repo
# as a marketplace and installs the pack from it into each profile.
[pack]
path = "plugins/teams"

[runners.claude]
command = "claude -p {prompt} --model {model} --add-dir {root}"
timeout_minutes = 45

[runners.gemini]
command = "{root}/tools/gemini-review {prompt} {root}"
timeout_minutes = 60

[roles.programmer]
model = "sonnet"
effort = "high"
profile = "lean"
turns = 150

[roles.team]
model = "opus"
effort = "xhigh"
profile = "build"
turns = 200
batch = 1

[roles.release]
model = "opus"
effort = "xhigh"
profile = "build"
turns = 200

# The phase actions run as roles of their own, so that the slice actions each one calls name them
# in their `group` (the ruling on #518): implement and fix run the slice steps that open and
# publish, merge the ones that land. Each is the programmer's settings, and the ruling-16 guard
# holds: no action is widened, so the programmer role still cannot land. merge starts no model.
[roles.implement]
model = "sonnet"
effort = "high"
profile = "lean"
turns = 150

[roles.fix]
model = "sonnet"
effort = "high"
profile = "lean"
turns = 150

[roles.merge]
model = "sonnet"
effort = "high"
profile = "lean"
turns = 1

[check.pr]
steps = ["ci"]

# A task's phases, one list for each issue type: implement opens the pull request, ci and review
# wait on it (a failure of either starts fix, a model), and merge lands it. Review is a wait with
# no model (the ruling on #452). implement and fix start the programmer on its pack with
# `zaf brief --phase implement` and `zaf brief --phase fix`.
[phases]
Task = ["implement", "ci", "review", "merge"]
Bug = ["implement", "ci", "review", "merge"]

[ask]
ladder = ["haiku", "sonnet"]
max = 5
cache_hours = 24

[spawn]
slots = 4
guard = [70, 85, 95]

[isolation]
kind = "process"

# Commands no instance runs, in every profile: each becomes a deny, bare and with arguments.
# The merge paths are denied here so that only `zaf do slice-merge` and `zaf do release`,
# which this list never names, merge anything. Regenerate the profiles after editing it:
# a profile already written has no denies until `zaf profile init` runs again.
[forbidden]
commands = [
  "gh pr merge",
  "zaf forge merge",
  "zaf do pr-merge",
  "zaf do land",
  "zaf do ship",
  "zaf do --tier machine pr-merge",
  "zaf do --tier machine land",
  "zaf do --tier machine ship",
]

# Forgejo's copy of the release build. Forgejo reads `.forgejo/workflows` and then ignores
# `.github/workflows`; GitHub never reads this folder. It differs from GitHub's in three ways:
# the instance has no macOS runner, so only the Linux musl binary is built; nothing goes through
# upload-artifact (v4 refuses to run off github.com), so one job builds and publishes; and the
# release is made through Forgejo's API, since there is no `gh` here.
name: zaf-release

on:
  push:
    tags:
      - "zaf-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The zaf-v* tag to build and publish"
        required: true

permissions:
  contents: write

concurrency:
  group: zaf-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # rustup gets a home on the job's own disk: updating the toolchain baked into the runner's
  # image in place fails with "Invalid cross-device link" whenever a new stable is out.
  RUSTUP_HOME: /tmp/rustup

jobs:
  release:
    name: release (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Check Cargo.toml version matches the tag
        shell: bash
        run: |
          want="${TAG#zaf-v}"
          have="$(grep -m1 '^version' zaf/Cargo.toml | cut -d'"' -f2)"
          if [ "$have" != "$want" ]; then
            echo "zaf/Cargo.toml version '$have' does not match tag '$TAG' (expected '$want')" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zaf
          key: x86_64-unknown-linux-musl
      - name: Install musl-tools (the bundled SQLite is C)
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: zaf
        run: cargo build --release --locked --target "$TARGET"
      - name: Package archive and checksum
        shell: bash
        run: |
          name="$TAG-$TARGET"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage" dist
          cp "zaf/target/$TARGET/release/zaf" "$stage/"
          for lic in LICENSE zaf/LICENSE; do
            if [ -f "$lic" ]; then cp "$lic" "$stage/LICENSE"; break; fi
          done
          tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"
      - name: Create the release as a draft, upload the archive, its sum and install.sh, then publish
        shell: bash
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          # The token goes to curl in a config read from stdin, never on a command line.
          call() { printf 'header = "Authorization: token %s"\n' "$FORGEJO_TOKEN" | curl --config - -sS "$@"; }
          first_id() { grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2; }
          version="${TAG#zaf-v}"
          case "$version" in
            ''|*[!0-9A-Za-z.+-]*) echo "tag '$TAG' holds a version that cannot go into install.sh" >&2; exit 1 ;;
          esac
          # install.sh carries the tag's version; a script without the line is not shipped.
          if ! grep -qx 'ZAF_VERSION="0.0.0-dev"' zaf/install.sh; then
            echo 'zaf/install.sh has no line ZAF_VERSION="0.0.0-dev" to rewrite' >&2
            exit 1
          fi
          sed "s/^ZAF_VERSION=\"0.0.0-dev\"\$/ZAF_VERSION=\"$version\"/" zaf/install.sh > dist/install.sh
          grep -qx "ZAF_VERSION=\"$version\"" dist/install.sh
          # The notes are the tag's commit message, put into the request by a JSON encoder, never
          # pasted into a string.
          git log -1 --format=%B HEAD > "$RUNNER_TEMP/notes.txt"
          if command -v jq >/dev/null 2>&1; then
            jq -n --arg tag "$TAG" --rawfile body "$RUNNER_TEMP/notes.txt" \
              '{tag_name: $tag, name: $tag, body: $body, "draft": true}' > "$RUNNER_TEMP/release.json"
          elif command -v python3 >/dev/null 2>&1; then
            python3 -c 'import json, sys; print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[1], "body": open(sys.argv[2]).read(), "draft": True}))' \
              "$TAG" "$RUNNER_TEMP/notes.txt" > "$RUNNER_TEMP/release.json"
          else
            echo "neither jq nor python3 is on this runner to encode the release notes" >&2
            exit 1
          fi
          id=$(call "$API/releases/tags/$TAG" | first_id || true)
          if [ -z "$id" ]; then
            id=$(call -f -X POST -H 'Content-Type: application/json' \
              --data "@$RUNNER_TEMP/release.json" "$API/releases" | first_id)
          fi
          if [ -z "$id" ]; then
            echo "no release for $TAG and none could be made" >&2
            exit 1
          fi
          for file in dist/*; do
            name=$(basename "$file")
            # An asset of this name from an earlier run is replaced.
            old=$(call "$API/releases/$id/assets" | grep -o "\"id\":[0-9]*,\"name\":\"$name\"" | head -n 1 | cut -d: -f2 | cut -d, -f1 || true)
            if [ -n "$old" ]; then
              call -f -X DELETE "$API/releases/$id/assets/$old"
            fi
            call -f -X POST -F "attachment=@$file" "$API/releases/$id/assets?name=$name" >/dev/null
            echo "uploaded $name"
          done
          # Every file is up: only now is the release published.
          call -f -X PATCH -H 'Content-Type: application/json' -d '{"draft":false}' "$API/releases/$id" >/dev/null
          echo "published $TAG"

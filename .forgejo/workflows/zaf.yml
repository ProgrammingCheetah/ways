# Forgejo's copy of the gate. Forgejo reads `.forgejo/workflows` and then ignores
# `.github/workflows`; GitHub never reads this folder. It differs from GitHub's in one way:
# the instance has no macOS runner, so the gate runs on Linux alone.
name: zaf

on:
  pull_request:
    paths:
      - "zaf/**"
      - ".zaf/**"
      - ".zaf.toml"
      - ".forgejo/workflows/zaf.yml"
      - "plugins/teams/**"
  push:
    branches: [main]
    paths:
      - "zaf/**"
      - ".zaf/**"
      - ".zaf.toml"
      - ".forgejo/workflows/zaf.yml"
      - "plugins/teams/**"

permissions:
  contents: read

concurrency:
  group: zaf-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: zaf

env:
  # rustup gets a home on the job's own disk: updating the toolchain baked into the runner's
  # image in place fails with "Invalid cross-device link" whenever a new stable is out.
  RUSTUP_HOME: /tmp/rustup
  JJ_VERSION: v0.46.0
  JJ_USER: zaf-ci
  JJ_EMAIL: zaf-ci@example.invalid

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          # the pack test reads each action at the last release tag
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zaf
      - name: Install jj (the Vcs adapter's tests drive a real jj)
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)  target=x86_64-unknown-linux-musl ;;
            Linux-ARM64) target=aarch64-unknown-linux-musl ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            macOS-X64)  target=x86_64-apple-darwin ;;
            *) echo "no jj build for ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          curl -sSfL "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-${target}.tar.gz" | tar -xz -C "$RUNNER_TEMP" ./jj
          install -m 0755 "$RUNNER_TEMP/jj" /usr/local/bin/jj
          jj --version
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      # nextest runs each test as its own process and retries a failed one (zaf/.config/nextest.toml);
      # it does not run doc tests, so those keep `cargo test`.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --locked
      - run: cargo test --doc --locked

  musl:
    name: musl build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zaf
          key: x86_64-unknown-linux-musl
      - name: Install musl-tools (the bundled SQLite is C)
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl

  web-build-fresh:
    name: web-build-fresh (the committed page build is the fresh one)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zaf/web/package-lock.json
      - name: Install the page's locked dependencies
        working-directory: zaf/web
        run: npm ci
      - name: Build the page
        working-directory: zaf/web
        run: npm run build
      - name: Fail when the build differs from the committed one
        # the repository root, not the `zaf` folder the defaults above set, so the paths below resolve
        working-directory: .
        # intent-to-add makes a file the build newly wrote show in the diff; a deleted one shows already
        run: |
          git add --intent-to-add zaf/web/dist
          git diff --exit-code -- zaf/web/dist || {
            echo "zaf/web/dist is stale: run 'npm ci && npm run build' in zaf/web and commit dist/" >&2
            exit 1
          }

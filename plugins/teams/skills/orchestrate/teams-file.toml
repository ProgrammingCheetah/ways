# .claude/TEAMS.toml: the same configuration as the Markdown teams file, for an Engineer who
# prefers TOML. A .claude/TEAMS.yaml uses these same keys and nesting. Every value is the default.

shared_ground = []               # lockfiles, migrations, generated files, root config, CI
opt_outs = []                    # e.g. [{ what = "nodes", date = "2026-10-16", words = "..." }]

[repository]
owner = "engineer"               # engineer (committed) | others (kept out of git)
docs = ".teams"                  # outside .claude/, whose writes always prompt
style = []                       # e.g. ["docs/style.md"]
decisions = ""                   # e.g. "docs/adr/"
vcs = "git"                      # git | jj
main = "main"
workspaces = "../{repo}-workspaces"  # one per branch, named after it (/ as -)
teardown = []                    # run in a workspace before /teams:cleanup removes it, one element per command, e.g. ["docker compose -p {name} down -v"]
                                 # {name} = folder name, {path} = absolute path; both substituted single-quoted, so don't quote them
gate = ""                        # exactly what CI runs
light_gate = ""

[branches]
strategy = "integration"         # integration (one branch per release, one PR into main at its end) | trunk (a PR per slice into main; QA after merge)
integration = "release/{release}"  # cut and pushed before slice 1; {release}: the version as release.version_format writes it
slice = "{team}/{release}-{n}-{part}"  # {team}: / as -; an off-cycle branch matches none of these patterns
fix = "{team}/{release}-m{n}-fix"     # a milestone fix round's branch
engineer_reviews = ["main"]
merge_slice = "merge"            # merge | squash | rebase
merge_main = "squash"            # a squashed release PR is one commit on main; "merge" keeps its slices

[tracker]
kind = "none"                    # none | github | jira | linear | other
project = ""
commit_format = ""

[release]
version_format = "v{version}"
stages = []
documents = ["design"]
format = "markdown"              # markdown | typst

[lanes]                          # model / effort passed to the Agent call; {} = the agent file's
# Only programmers may run on Sonnet: build / subsystem model pins every programmer to it,
# e.g. build = { model = "opus" }; {} = the build lead picks sonnet or opus per task.
# Security-nature work and every other role are always Opus, whatever is set (effort may be set).
plan = {}
judgment = {}
build = {}
subsystem = {}
glue = {}

[limits]
max_lanes = 2
small_lanes = 4
internal_after = 3

[reviews]
release_reviews = true           # compliance, architecture and security at each release's end, before its last QA
security_triggers = ["authentication", "authorization and permissions", "sessions, tokens, secrets and keys", "cryptography", "untrusted input", "trust boundaries", "network egress", "personal data storage"]
compliance_triggers = ["personal data", "payments", "accessibility", "a new dependency's license"]
bot = ""
comment_prefix = "Claude:"

# A team: a named lead. The "qa" row is the top-level QA and the architects' lead is the architect: both stand beside the Orchestrator.
# Programmers aren't listed: each is short-lived, spawned and named by its build lead for one task. Review teams list their standing reviewers.
[[team]]
name = "qa"
mission = "Top-level QA: documents for the Engineer, every milestone, every PR into main"
owns = []
lead = ""

[[team]]
name = "internal"
mission = "Finds the most effective way for the teams to work and spend their time"
owns = []
lead = ""

[[team]]
name = "compliance"
mission = "Release review: what the project is legally bound to follow"
owns = []
lead = ""
reviewers = []

[[team]]
name = "architects"
mission = "Reviews every milestone, before QA; release review: correct architecture"
owns = []
lead = ""
reviewers = []

[[team]]
name = "security"
mission = "Every security-triggered slice (its plan, then its code), and the release review"
owns = []
lead = ""
reviewers = []

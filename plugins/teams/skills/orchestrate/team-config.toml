# <config dir>/<file>.toml: one team's Roles and the special instructions each must follow, for a teams file in TOML.
# A YAML team config file uses these same keys and nesting. Same meaning as team-config.md; [] means none.
# The keys below are the pack's roles; drop the ones you don't use. Any other key is a free-form role, for a special
# occasion: it never breaks the file, and the Orchestrator asks the Engineer when it can't tell whose brief it covers.
# Yours to edit; no agent edits it.

[roles]
every_role = []                  # every brief of this team's Spawns, e.g. ["Run the migration check before every commit."]
lead = []
build_lead = []
programmer = []                  # the build lead passes these and every_role on to its programmers
security_reviewer = []           # these four also reach whoever reviews this team's work
release_reviewer = []
top_level_qa = []
architect = []
# e.g. a free-form role: migration_author = ["..."]
